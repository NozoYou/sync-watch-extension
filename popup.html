<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <link rel="stylesheet" href="popup.css" />
        <title>一起看</title>
    </head>
    <body>
        <header>
            <div class="brand">▶</div>
            <div>
                <h1>一起看</h1>
                <p>小房间网页视频同步</p>
            </div>
        </header>

        <!-- Server settings stay collapsed after a server address is saved. -->
        <details id="connection-settings">
            <summary id="settings-summary">连接设置</summary>
            <label for="server">信令服务器地址</label>
            <div class="server-row">
                <input
                    id="server"
                    type="password"
                    placeholder="wss://域名/ws 或 ws://主机公网IP:8787/ws"
                    spellcheck="false"
                    autocomplete="off"
                />
                <button id="toggle-server" class="quiet" type="button">
                    显示
                </button>
            </div>
            <p class="small" id="server-help">
                地址保存在此浏览器扩展中。每位参与者都需配置同一地址。
            </p>
        </details>

        <!-- Create a room or join one with the code shared by the host. -->
        <div class="actions">
            <button id="create" class="primary">创建房间</button>
            <input
                id="room-input"
                maxlength="8"
                placeholder="房间码"
                autocomplete="off"
            />
            <button id="join">加入</button>
        </div>

        <!-- Room status and navigation choices are shown while in a room. -->
        <section id="room-box" class="room hidden">
            <div class="room-top">
                <span>房间码</span>
                <strong id="room-code"></strong>
                <button id="copy-room" class="quiet">复制</button>
                <button id="leave" class="quiet">离开</button>
            </div>

            <div class="room-meta">
                <span id="room-connection">正在连接服务器…</span>
                <span id="room-members">房间人数：—</span>
            </div>

            <!-- Shows the host's current shared title and playback position. -->
            <section id="room-playback" class="room-playback hidden">
                <div class="room-playback-heading">
                    <strong id="room-playback-title">等待视频状态…</strong>
                    <span id="room-playback-status">—</span>
                </div>
                <progress
                    id="room-playback-progress"
                    max="100"
                    value="0"
                ></progress>
                <div class="room-playback-time">
                    <span id="room-playback-current">0:00</span>
                    <span id="room-playback-duration">—</span>
                </div>
            </section>

            <div id="auto-follow-control" class="auto-follow-control hidden">
                <label class="setting-checkbox" for="auto-follow">
                    <input id="auto-follow" type="checkbox" />
                    自动跟随房主分享的新视频
                </label>
            </div>

            <div class="tab-marker-control">
                <label class="setting-checkbox" for="modify-tab-icon">
                    <input id="modify-tab-icon" type="checkbox" />
                    修改房间标签页图标
                </label>
                <p class="small">参与同步的标签页标题会自动添加 [一起看] 前缀。</p>
            </div>

            <section id="auto-pause-panel" class="auto-pause-panel">
                <label class="setting-checkbox" for="auto-pause">
                    <input id="auto-pause" type="checkbox" />
                    新视频就绪后自动暂停
                </label>
                <label
                    id="auto-pause-duration-row"
                    class="auto-pause-duration-row"
                    for="auto-pause-duration"
                >
                    暂停时长
                    <select id="auto-pause-duration">
                        <option value="3">3 秒</option>
                        <option value="5">5 秒</option>
                        <option value="10">10 秒</option>
                        <option value="manual">直到点击播放</option>
                    </select>
                </label>
                <p id="auto-pause-owner" class="small hidden">
                    自动暂停设置由房主管理。
                </p>
            </section>

            <section id="host-member-settings" class="host-member-settings hidden">
                <h2>成员权限</h2>
                <div id="member-settings-list"></div>
            </section>

            <!-- DEBUG ZONE: keep injection diagnostics and reinjection tools isolated. -->
            <details id="injection-debug" class="injection-debug hidden">
                <summary>调试区：注入状态与重新注入</summary>
                <p class="small">
                    显示成员脚本心跳和视频监听状态。重新注入不会退出房间，
                    但会替换当前标签页中的扩展监听器。
                </p>
                <div id="injection-debug-list"></div>
            </details>

            <div id="navigation-panel" class="navigation-panel hidden">
                <strong id="navigation-title"></strong>
                <a id="navigation-url" target="_blank" rel="noreferrer"></a>
                <p id="follow-summary"></p>
                <div id="follow-actions" class="follow-actions">
                    <button id="follow-yes" class="primary">跟随跳转</button>
                    <button id="follow-no" class="quiet">不跟随</button>
                </div>
            </div>

            <section id="share-history" class="share-history hidden">
                <h2>分享记录</h2>
                <div id="recent-share-list"></div>
                <details id="older-shares" class="older-shares hidden">
                    <summary id="older-shares-summary">更早的分享</summary>
                    <div id="older-share-list"></div>
                </details>
            </section>

            <details id="connection-details">
                <summary>连接详情</summary>
                <p>播放控制指令经房间服务器转发；视频画面和音频不会经过服务器。</p>
            </details>
        </section>

        <p id="status" role="status">
            打开视频页面后创建房间，或输入朋友分享的房间码加入。
        </p>

        <script src="popup.js"></script>
    </body>
</html>
